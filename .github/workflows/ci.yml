# ---------------------------------------------------------------------------
# Continuous integration.
#
# It is the gate that keeps out of `develop` code that does not build, does not
# type-check or does not pass the tests. We sell CI: not having it would be
# incoherent.
#
# The end-to-end tests go in `e2e.yml` because they are slow and create real
# git repositories; keeping them apart holds this check under a minute and
# gives fast feedback on every push.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [develop, Prod]
  push:
    branches: [develop, Prod]
  schedule:
    # Mondays at 6:00 UTC: secret scanning over the whole history.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A new push on the same branch cancels the previous run: it saves minutes,
# which are a limited resource in a private repository.
concurrency:
  group: ci-${{ github.ref }}
  # Only Pull Requests are cancelled. On `develop` and `Prod`, cancelling would
  # leave an integrated commit with no CI result, and CONTRIBUTING says the
  # integration branch must always be green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: these jobs only need to read the code.
permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One version failing does not cancel the others: we want to know whether
      # the failure belongs to one version or to all of them.
      fail-fast: false
      matrix:
        # 22 is the floor: pnpm 11 uses `node:sqlite` and requires Node >= 22.13,
        # so on 20 we cannot even install dependencies. What can be tested is
        # what is supported. 24 is the active LTS and 26 is what we develop on
        # locally: if it is not tested, a failure only on 26 is found late.
        node: ['22.13', '24', '26']

    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The turbo cache avoids rebuilding packages that have not changed.
      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit


  quality:
    name: Types and coherence
    # A job of its own, outside the matrix and with no `if` conditions. These
    # used to be matrix steps with `if: matrix.node == '22'`; when the matrix
    # changed to '22.13' the condition stopped matching and both steps were
    # skipped in silence on every run. Here there is no condition to drift.
    # `tsc` does not depend on the runtime (it uses @types/node from the
    # lockfile), so one version is enough: the declared floor.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Coherence between what we declare and what we test
        run: pnpm check:coherence

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks needs the full history to review every commit, not only the
          # working tree. Without this it would only see the latest state.
          fetch-depth: 0

      # NOTE: if this repository moves to a GitHub organisation, this action
      # will require a GITLEAKS_LICENSE secret. While it is a personal account,
      # it is free.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  history:
    name: Secret scanning over the whole history
    # The `secrets` job only looks at the commits of the Pull Request. The
    # history before this workflow was never reviewed, and the repository is
    # public: a credential in the import commit would be visible to anyone.
    # This covers it, weekly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
