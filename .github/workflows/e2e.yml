# ---------------------------------------------------------------------------
# End-to-end tests.
#
# They create real git repositories in temporary directories and run the full
# cycle: scan, plan, apply and roll back. They are the ones that really prove
# the tool does not corrupt a client's repository.
#
# They are kept apart from `ci.yml` because they are slow and touch git. They
# run on a single Node version: what they test is behaviour, not compatibility.
# ---------------------------------------------------------------------------
name: E2E

on:
  pull_request:
    branches: [develop, Prod]
  push:
    branches: [develop, Prod]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  full-cycle:
    name: Full cycle on real repositories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build: the tests import `src` through the vitest aliases and load
      # nothing from `dist`. Building here would be 30 seconds of nothing in the
      # workflow that exists precisely because it is slow.
      # The tests set the git identity in every temporary repository they
      # create, so no global configuration is needed here.
      - name: End-to-end tests
        run: pnpm test:e2e
