# ---------------------------------------------------------------------------
# Mutation tests of the protected-branch logic.
#
# `check:mutations` undoes on purpose each piece of the branch logic and checks
# that some test fails. Until F0-27 it ran nowhere: it depended on someone
# remembering to launch it, so it was not a control, it was a recommendation.
# Here it no longer depends on anyone.
#
# It is its own workflow, not a job of `ci.yml`, for two reasons:
#
#   - It takes around ten minutes: inside `ci.yml` it would delay the fast
#     feedback that workflow exists to give.
#   - The `paths:` filter belongs to the whole workflow. As a job with `if:` it
#     would show as *Skipped* on every other PR —the noise F0-27 avoids here and
#     that F0-23, still pending, will remove from the history scan— and an `if`
#     condition drifts in silence (napkin).
#
# CAREFUL WHEN MAKING IT REQUIRED: with a `paths:` filter, a PR that does not
# touch those files does not trigger this workflow, and a required check that
# never arrives stays *pending* forever and blocks the merge. If it enters the
# ruleset, the filter has to go first.
# ---------------------------------------------------------------------------
name: Mutations

on:
  pull_request:
    branches: [develop, Prod]
    # Only the PRs that touch what the script mutates or runs. `pnpm
    # check:coherence` verifies the list against `scripts/check-mutations.mjs`:
    # if a new mutation touches a file that is not here, the CI says so.
    paths:
      - 'packages/cli/src/commands.ts'
      - 'packages/cli/src/context.ts'
      - 'packages/cli/test/e2e.test.ts'
      - 'packages/cli/test/head-moved.test.ts'
      - 'packages/cli/test/protected-branches.test.ts'
      - 'packages/packs-sdk/src/branches.test.ts'
      - 'packages/packs-sdk/src/branches.ts'
      - 'packages/packs-sdk/src/contract.ts'
      - 'packages/packs/node-ts/src/index.ts'
      - 'packages/packs/node-ts/src/templates/ci.ts'
      - 'packages/packs/node-ts/src/validate.test.ts'
      - 'packages/packs/node-ts/src/workflow-checks.ts'
      - 'packages/scanner/src/git.ts'
      - 'packages/scanner/test/default-branch.test.ts'
      - 'vitest.setup.ts'
      # The control itself and what decides how the tests run.
      - 'scripts/check-mutations.mjs'
      - 'scripts/mutation-paths.mjs'
      - 'scripts/mutation-outcome.mjs'
      - '.github/workflows/mutations.yml'
      - 'vitest.config.ts'
  workflow_dispatch:

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutations:
    name: Branch logic mutations
    # A job of its own, with no matrix and no `if` conditions: what decides
    # whether this runs is the `paths:` filter above, in a single place.
    runs-on: ubuntu-latest
    # Thirty mutations, each one a full test suite. Locally it takes about three
    # minutes; the margin is for a slow runner, not for the normal case. The
    # script also has its own 5-minute cap per mutation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # The declared floor is enough: this tests test coverage, not
          # compatibility across Node versions.
          node-version: '22.13'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build: the tests import `src` through the vitest aliases.
      # The script injects its own hostile git configuration (a signature that
      # always fails), so no identity is configured here.
      - name: Mutation tests
        run: pnpm check:mutations
