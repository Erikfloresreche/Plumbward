# ---------------------------------------------------------------------------
# Automatic dependency updates.
#
# GitHub actions are third-party code that runs with access to the repository:
# keeping them up to date is part of the hygiene this product sells. We start
# with the actions only; npm dependencies will come in when the changesets
# flow exists (F0-6).
# ---------------------------------------------------------------------------
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Without this, Dependabot opens PRs against the default branch, which is
    # not the integration one: updates would get in skipping `develop`.
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'build'
